[package]
name = "cargo-xtest"
description = "Run Rust integration tests in Microsandbox"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
microsandbox = { version = "=0.6.8", default-features = false, features = ["net", "prebuilt"] }
microsandbox-network = "=0.6.8"
tokio = { version = "=1.52.3", features = ["io-util", "process", "rt-multi-thread", "signal"] }

[dev-dependencies]
trycmd = { version = "=1.2.1", default-features = false, features = ["diff", "filesystem"] }

[lints.clippy]
all = "deny"
cargo = "deny"
pedantic = "deny"
