name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            guest_target: x86_64-unknown-linux-musl
          - os: windows-latest
            guest_target: x86_64-unknown-linux-musl
          - os: macos-latest
            guest_target: aarch64-unknown-linux-musl
    steps:
      # The Windows runners have autocrlf enabled by default.
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
        if: matrix.os == 'windows-latest'

      - name: Checkout
        uses: actions/checkout@v6

      # https://github.com/actions/cache/blob/main/examples.md#rust---cargo
      # Depends on `Cargo.lock` --> Has to be after checkout.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal --component rust-src,rustfmt,clippy,miri --target ${{ matrix.guest_target }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Run tests (miri)
        run: cargo miri test --all-features --all-targets
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-backtrace=full

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -D clippy::all -W clippy::pedantic -D clippy::cargo

  runtime:
    runs-on: ubuntu-latest
    env:
      CARGO_XTEST_VM_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}-runtime

      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal --target x86_64-unknown-linux-musl

      - name: Configure Microsandbox runtime
        run: echo "MSB_HOME=${RUNNER_TEMP}/microsandbox" >> "${GITHUB_ENV}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Prepare Microsandbox runtime
        run: cargo test --test cli --all-features --no-run

      - name: Verify Microsandbox runtime
        run: |
          test "$("${MSB_HOME}/bin/msb" --version)" = 'msb 0.6.8'
          test -f "${MSB_HOME}/lib/libkrunfw.so.5"

      - name: Run Microsandbox UI tests
        run: cargo test --test cli --all-features -- cli trycmd=runtime-
